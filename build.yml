name: Build ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli config init --overwrite
      - run: arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
      - run: arduino-cli core update-index
      - run: arduino-cli core install esp32:esp32
      - run: arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build .
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32-BIN
          path: build/*.bin
